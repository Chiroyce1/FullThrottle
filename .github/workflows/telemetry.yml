name: Ingest Telemetry

on:
  schedule:
    # Run hourly on Friday, Saturday, Sunday, and early Monday UTC (F1 weekend sessions)
    - cron: "0 * * * 5,6,0"
    - cron: "0 0-4 * * 1"
  workflow_dispatch:
    inputs:
      year:
        description: "Season Year"
        required: false
        default: "2026"
      round:
        description: "Round Number (leave blank to auto-detect missing completed rounds)"
        required: false
        default: ""
      session:
        description: "Session code (e.g. all, r, q, fp1)"
        required: false
        default: "all"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed so github-actions[bot] can commit metadata.json
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fast pre-check pending sessions
        id: precheck
        run: python ingest/check_pending.py ${{ inputs.year || '2026' }}

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.precheck.outputs.has_pending == 'true'
        run: pip install -r ingest/requirements.txt

      - name: Run pipeline tests
        if: github.event_name == 'workflow_dispatch' || steps.precheck.outputs.has_pending == 'true'
        run: python -m unittest discover ingest

      - name: Ingest & sync telemetry
        if: github.event_name == 'workflow_dispatch' || steps.precheck.outputs.has_pending == 'true'
        working-directory: ingest
        env:
          HF_TOKEN: ${{ secrets.HF_WRITE_KEY || secrets.HF_TOKEN }}
          HF_REPO: "${{ secrets.HF_REPO || 'fullthrottlef1/fullthrottle' }}"
          YEAR: ${{ inputs.year || '2026' }}
          ROUND: ${{ inputs.round }}
          SESSION: ${{ inputs.session }}
        run: |
          CMD="python sync.py $YEAR --upload"
          if [ -n "$ROUND" ]; then
            CMD="$CMD --round $ROUND"
          fi
          if [ -n "$SESSION" ]; then
            CMD="$CMD --session $SESSION"
          fi
          $CMD

      - name: Commit updated metadata.json
        if: github.event_name == 'workflow_dispatch' || steps.precheck.outputs.has_pending == 'true'
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: auto-update telemetry metadata.json"
          file_pattern: "static/metadata.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
