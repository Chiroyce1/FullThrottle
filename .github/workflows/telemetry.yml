name: Ingest Telemetry

on:
  schedule:
    # Run every hour at minute 0
    - cron: "0 * * * *"
  workflow_dispatch: # Allows manual triggers

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed so the bot can commit metadata.json
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install fastf1 pandas pyarrow huggingface_hub python-dotenv

      - name: Ingest new sessions from FastF1
        continue-on-error: true
        working-directory: ingest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: "${{ secrets.HF_REPO }}"
        run: python ingest.py 2026

      - name: Rebuild metadata.json
        working-directory: ingest
        run: python build_metadata.py

      - name: Upload new files to Hugging Face
        working-directory: ingest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: "${{ secrets.HF_REPO }}"
        run: python upload.py

      - name: Commit updated metadata.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update telemetry metadata.json"
          file_pattern: "static/metadata.json"
